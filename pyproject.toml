[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scholar-service"
version = "0.1.0"
description = "Open scholarly search and full-text retrieval microservice"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pydantic-settings>=2.2",
  "beautifulsoup4>=4.12",
  "lxml>=5.1",
  "python-dotenv>=1.0",
  "pypdf>=4.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "respx>=0.21",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls real external scholarly APIs"]
